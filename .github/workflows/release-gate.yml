name: Release Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler-gate:
    name: Release / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - dmd-2.111.0
          - dmd-2.112.1
          - dmd-2.113.0
          - ldc-1.41.0
          - ldc-1.42.0
          - ldc-1.43.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up D compiler and DUB
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
          dub: 1.40.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev pkg-config

      - name: Show toolchain
        run: |
          "$DC" --version
          dub --version

      - name: Ensure local catalog/research data are not tracked
        shell: bash
        run: |
          if [[ -n "$(git ls-files -- catalogs/local reports/local)" ]]; then
            echo 'Local reference catalog or research cache is tracked; stop.' >&2
            exit 1
          fi

      - name: Enforce lean release boundary
        run: |
          python3 tools/check_release_boundary.py --self-test
          python3 tools/check_release_boundary.py

      - name: Offline D unit tests
        run: dub test --compiler="$DC" --force

      - name: Release configuration build
        run: dub build --build=release --compiler="$DC" --force
